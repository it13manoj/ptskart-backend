version: '3.8'

services:
  # Spring Boot Backend API
  springboot-app:
    build: .
    image: ghcr.io/it13manoj/ptskart-backend:latest
    container_name: ptskart-backend
    restart: always
    ports:
      - "9002:9002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=9002
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/ptskart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-devtoos}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-DevTools$$123}
      - BREVO_USER=${BREVO_USER:-bbd375001@smtp-brevo.com}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-info@batohidriver.com}
    networks:
      - ptskart-network

  # Optional MySQL Database Container (if server does not run host MySQL)
  # Uncomment if you want Docker to manage MySQL as well:
  # mysql-db:
  #   image: mysql:8.0
  #   container_name: ptskart-mysql
  #   restart: always
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: DevTools$$123
  #     MYSQL_DATABASE: ptskart
  #     MYSQL_USER: devtoos
  #     MYSQL_PASSWORD: DevTools$$123
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   networks:
  #     - ptskart-network

# volumes:
#   mysql-data:

networks:
  ptskart-network:
    driver: bridge